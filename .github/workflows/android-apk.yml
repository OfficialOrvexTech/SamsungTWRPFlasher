name: Samsung TWRP APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: samsung-twrp-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Samsung TWRP debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android project files
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository: $GITHUB_WORKSPACE"

          if [[ ! -f "$GITHUB_WORKSPACE/settings.gradle" && ! -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]]; then
            echo "ERROR: settings.gradle or settings.gradle.kts is missing from the repository root." >&2
            exit 1
          fi

          if [[ ! -f "$GITHUB_WORKSPACE/build.gradle" && ! -f "$GITHUB_WORKSPACE/build.gradle.kts" ]]; then
            echo "ERROR: build.gradle or build.gradle.kts is missing from the repository root." >&2
            exit 1
          fi

          if [[ ! -f "$GITHUB_WORKSPACE/app/build.gradle" && ! -f "$GITHUB_WORKSPACE/app/build.gradle.kts" ]]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts is missing." >&2
            exit 1
          fi

          if [[ ! -f "$GITHUB_WORKSPACE/app/src/main/AndroidManifest.xml" ]]; then
            echo "ERROR: app/src/main/AndroidManifest.xml is missing." >&2
            exit 1
          fi

          echo "Android project files were found."

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Install Android SDK platform 35
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "ERROR: Android SDK directory was not found on this runner." >&2
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "ERROR: Android SDK sdkmanager was not found." >&2
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Gradle version:"
          gradle --version

          gradle --no-daemon --stacktrace --console=plain \
            --project-dir "$GITHUB_WORKSPACE" \
            :app:assembleDebug

      - name: Prepare APK artifact
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$APK_FILE" ]]; then
            APK_FILE="$(find "$GITHUB_WORKSPACE/app/build/outputs/apk" -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          fi

          if [[ -z "$APK_FILE" || ! -f "$APK_FILE" ]]; then
            echo "ERROR: Build finished, but no APK file was found." >&2
            exit 1
          fi

          OUTPUT_DIR="$RUNNER_TEMP/samsung-twrp-apk"
          mkdir -p "$OUTPUT_DIR"
          OUTPUT_APK="$OUTPUT_DIR/Samsung-TWRP-Tool-debug.apk"
          cp "$APK_FILE" "$OUTPUT_APK"

          echo "apk_path=$OUTPUT_APK" >> "$GITHUB_OUTPUT"
          echo "APK created successfully:"
          ls -lh "$OUTPUT_APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Samsung-TWRP-Tool-debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
          
